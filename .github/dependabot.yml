# Dependabot: one pull request per ecosystem, once a week.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # npm dev dependencies (the package has no runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      # Every version update, majors included, in one weekly pull request.
      npm:
        applies-to: version-updates
        patterns:
          - "*"
      # Every security fix (also of indirect dependencies) in one pull request.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Actions used in .github/workflows (checkout, setup-node).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
